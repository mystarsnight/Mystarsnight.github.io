<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>ScreenDraw</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#080a0f;
  color:#fff;
}

button,input{
  font:inherit;
}

#app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

#topbar{
  height:70px;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:rgba(15,17,23,.97);
  border-bottom:1px solid rgba(255,255,255,.09);
  z-index:20;
}

.logo{
  font-size:19px;
  font-weight:800;
  white-space:nowrap;
}

.logo span{
  color:#4d9cff;
}

#urlBox{
  flex:1;
  min-width:0;
  height:44px;
  display:flex;
  align-items:center;
  background:#20242d;
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;
  overflow:hidden;
}

#url{
  width:100%;
  height:100%;
  padding:0 14px;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:15px;
}

#url::placeholder{
  color:#89909d;
}

#go{
  height:44px;
  padding:0 18px;
  border:0;
  border-radius:12px;
  background:#287cff;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

#go:active{
  transform:scale(.97);
}

#viewer{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#fff;
}

#website{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
  z-index:1;
}

/*
  Drawing layer.
  It starts enabled because Pen mode is the default.
*/
#drawCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  touch-action:none;
  pointer-events:auto;
}

/*
  When Click mode is active, the website receives
  the mouse/touch events instead.
*/
#viewer.clickMode #drawCanvas{
  pointer-events:none;
}

#toolbar{
  position:absolute;
  z-index:10;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  border-radius:17px;
  background:rgba(18,21,28,.94);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 40px rgba(0,0,0,.4);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.tool{
  width:43px;
  height:43px;
  border:0;
  border-radius:11px;
  background:#292e38;
  color:#fff;
  cursor:pointer;
  font-size:18px;
}

.tool:active{
  transform:scale(.94);
}

.tool.active{
  background:#287cff;
}

#color{
  width:43px;
  height:43px;
  padding:5px;
  border:0;
  border-radius:11px;
  background:#292e38;
}

#size{
  width:95px;
  accent-color:#4d9cff;
}

#strokeInfo{
  position:absolute;
  z-index:11;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 14px;
  border-radius:999px;
  background:rgba(15,17,23,.9);
  border:1px solid rgba(255,255,255,.1);
  color:#dce3ef;
  font-size:13px;
  font-weight:600;
  pointer-events:none;
  opacity:0;
  transition:opacity .2s;
}

#strokeInfo.show{
  opacity:1;
}

#loading{
  position:absolute;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:#0c0f15;
}

.loaderBox{
  text-align:center;
}

.spinner{
  width:42px;
  height:42px;
  margin:0 auto 14px;
  border:4px solid rgba(255,255,255,.12);
  border-top-color:#4d9cff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#blocked{
  position:absolute;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:#0b0e14;
}

.blockedCard{
  width:min(470px,100%);
  padding:30px;
  text-align:center;
  border-radius:22px;
  background:#151922;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 20px 70px rgba(0,0,0,.4);
}

.blockedIcon{
  width:65px;
  height:65px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#292f3b;
  font-size:29px;
}

.blockedCard h1{
  margin:0 0 10px;
  font-size:25px;
}

.blockedCard p{
  margin:0;
  color:#aab3c2;
  line-height:1.55;
}

.blockedCard button{
  margin-top:20px;
  padding:11px 18px;
  border:0;
  border-radius:11px;
  background:#287cff;
  color:#fff;
  font-weight:700;
}

body.fullscreen #topbar{
  display:none;
}

body.fullscreen #viewer{
  position:fixed;
  inset:0;
  z-index:100;
}

body.fullscreen #toolbar{
  bottom:22px;
}

@media(max-width:650px){

  #topbar{
    height:62px;
    min-height:62px;
    padding:8px;
    gap:7px;
  }

  .logo{
    display:none;
  }

  #urlBox{
    height:44px;
  }

  #go{
    padding:0 14px;
  }

  #toolbar{
    bottom:12px;
    max-width:calc(100% - 14px);
    overflow-x:auto;
  }

  #size{
    width:70px;
  }
}
</style>
</head>

<body>

<div id="app">

  <header id="topbar">

    <div class="logo">
      Screen<span>Draw</span>
    </div>

    <div id="urlBox">
      <input
        id="url"
        type="text"
        value="https://example.com"
        placeholder="Enter a website..."
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
      >
    </div>

    <button id="go">Go</button>

  </header>

  <main id="viewer">

    <iframe
      id="website"
      title="Website"
      src="https://example.com"
      allow="fullscreen"
    ></iframe>

    <canvas id="drawCanvas"></canvas>

    <div id="strokeInfo">
      Drawing disappears after 7 seconds
    </div>

    <div id="toolbar">

      <!-- CLICK MODE -->
      <button
        class="tool"
        id="clickMode"
        title="Interact with website"
      >☝</button>

      <!-- PEN -->
      <button
        class="tool active"
        id="pen"
        title="Draw"
      >✎</button>

      <!-- ERASER -->
      <button
        class="tool"
        id="eraser"
        title="Erase drawing"
      >⌫</button>

      <!-- COLOR -->
      <input
        id="color"
        type="color"
        value="#ff2d55"
        title="Color"
      >

      <!-- SIZE -->
      <input
        id="size"
        type="range"
        min="2"
        max="30"
        value="6"
        title="Brush size"
      >

      <!-- CLEAR -->
      <button
        class="tool"
        id="clear"
        title="Clear drawings"
      >×</button>

      <!-- FULLSCREEN -->
      <button
        class="tool"
        id="fullscreen"
        title="Fullscreen"
      >⛶</button>

    </div>

    <div id="loading">

      <div class="loaderBox">
        <div class="spinner"></div>
        <div>Loading website...</div>
      </div>

    </div>

    <div id="blocked">

      <div class="blockedCard">

        <div class="blockedIcon">↗</div>

        <h1>Embed blocked by site</h1>

        <p>
          This website doesn't allow itself to be displayed
          inside another website. Try another website or open
          the site directly.
        </p>

        <button id="tryAgain">
          Try Again
        </button>

      </div>

    </div>

  </main>

</div>

<script>
const viewer = document.getElementById("viewer");
const website = document.getElementById("website");
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

const urlInput = document.getElementById("url");
const goButton = document.getElementById("go");

const clickModeButton =
  document.getElementById("clickMode");

const penButton =
  document.getElementById("pen");

const eraserButton =
  document.getElementById("eraser");

const clearButton =
  document.getElementById("clear");

const fullscreenButton =
  document.getElementById("fullscreen");

const colorInput =
  document.getElementById("color");

const sizeInput =
  document.getElementById("size");

const strokeInfo =
  document.getElementById("strokeInfo");

const loading =
  document.getElementById("loading");

const blocked =
  document.getElementById("blocked");

const tryAgain =
  document.getElementById("tryAgain");


let strokes = [];
let currentStroke = null;
let drawing = false;
let erasing = false;
let clickMode = false;

let infoTimeout = null;
let loadTimer = null;
let loaded = false;


/* =========================
   CANVAS SIZE
========================= */

function resizeCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  const old =
    document.createElement("canvas");

  old.width = canvas.width;
  old.height = canvas.height;

  if(canvas.width && canvas.height){

    old
      .getContext("2d")
      .drawImage(
        canvas,
        0,
        0
      );
  }

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.round(rect.width * dpr);

  canvas.height =
    Math.round(rect.height * dpr);

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  if(old.width && old.height){

    ctx.drawImage(
      old,
      0,
      0,
      old.width,
      old.height,
      0,
      0,
      rect.width,
      rect.height
    );
  }
}

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   DRAWING
========================= */

function getPoint(event){

  const rect =
    canvas.getBoundingClientRect();

  return {
    x:event.clientX - rect.left,
    y:event.clientY - rect.top
  };
}


function startDrawing(event){

  if(clickMode) return;

  drawing = true;

  const p =
    getPoint(event);

  currentStroke = {

    points:[p],

    color:
      colorInput.value,

    size:
      Number(sizeInput.value),

    eraser:
      erasing,

    created:
      performance.now(),

    expires:
      performance.now() + 7000
  };

  strokes.push(currentStroke);

  canvas.setPointerCapture?.(
    event.pointerId
  );

  showStrokeMessage();
}


function continueDrawing(event){

  if(
    !drawing ||
    !currentStroke ||
    clickMode
  ){
    return;
  }

  const p =
    getPoint(event);

  const previous =
    currentStroke.points[
      currentStroke.points.length - 1
    ];

  currentStroke.points.push(p);

  drawSegment(
    previous,
    p,
    currentStroke
  );
}


function stopDrawing(){

  drawing = false;
  currentStroke = null;
}


canvas.addEventListener(
  "pointerdown",
  startDrawing
);

canvas.addEventListener(
  "pointermove",
  continueDrawing
);

canvas.addEventListener(
  "pointerup",
  stopDrawing
);

canvas.addEventListener(
  "pointercancel",
  stopDrawing
);

canvas.addEventListener(
  "pointerleave",
  stopDrawing
);


/* =========================
   DRAW SEGMENT
========================= */

function drawSegment(
  a,
  b,
  stroke
){

  ctx.save();

  ctx.lineWidth =
    stroke.size;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  if(stroke.eraser){

    ctx.globalCompositeOperation =
      "destination-out";

  }else{

    ctx.globalCompositeOperation =
      "source-over";

    ctx.strokeStyle =
      stroke.color;
  }

  ctx.beginPath();

  ctx.moveTo(
    a.x,
    a.y
  );

  ctx.lineTo(
    b.x,
    b.y
  );

  ctx.stroke();

  ctx.restore();
}


/* =========================
   RENDER STROKES
========================= */

function render(){

  const rect =
    canvas.getBoundingClientRect();

  ctx.clearRect(
    0,
    0,
    rect.width,
    rect.height
  );

  const now =
    performance.now();

  strokes =
    strokes.filter(
      stroke =>
        stroke.expires > now
    );

  for(const stroke of strokes){

    if(stroke.points.length === 1){

      const p =
        stroke.points[0];

      ctx.save();

      ctx.lineWidth =
        stroke.size;

      if(stroke.eraser){

        ctx.globalCompositeOperation =
          "destination-out";

      }else{

        ctx.globalCompositeOperation =
          "source-over";

        ctx.fillStyle =
          stroke.color;
      }

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        stroke.size / 2,
        0,
        Math.PI * 2
      );

      ctx.fill();

      ctx.restore();

      continue;
    }

    ctx.save();

    ctx.lineWidth =
      stroke.size;

    ctx.lineCap =
      "round";

    ctx.lineJoin =
      "round";

    if(stroke.eraser){

      ctx.globalCompositeOperation =
        "destination-out";

    }else{

      ctx.globalCompositeOperation =
        "source-over";

      ctx.strokeStyle =
        stroke.color;
    }

    ctx.beginPath();

    ctx.moveTo(
      stroke.points[0].x,
      stroke.points[0].y
    );

    for(
      let i = 1;
      i < stroke.points.length;
      i++
    ){

      ctx.lineTo(
        stroke.points[i].x,
        stroke.points[i].y
      );
    }

    ctx.stroke();

    ctx.restore();
  }

  requestAnimationFrame(render);
}


/* =========================
   CLICK MODE
========================= */

function enableClickMode(){

  clickMode = true;

  viewer.classList.add(
    "clickMode"
  );

  clickModeButton.classList.add(
    "active"
  );

  penButton.classList.remove(
    "active"
  );

  eraserButton.classList.remove(
    "active"
  );

  strokeInfo.textContent =
    "Click mode — interact with the website";

  strokeInfo.classList.add(
    "show"
  );

  clearTimeout(infoTimeout);

  infoTimeout =
    setTimeout(()=>{
      strokeInfo.classList.remove(
        "show"
      );
    },1800);
}


function enableDrawMode(){

  clickMode = false;

  viewer.classList.remove(
    "clickMode"
  );

  clickModeButton.classList.remove(
    "active"
  );

  penButton.classList.add(
    "active"
  );

  eraserButton.classList.remove(
    "active"
  );

  erasing = false;
}


clickModeButton.addEventListener(
  "click",
  enableClickMode
);


penButton.addEventListener(
  "click",
  ()=>{
    enableDrawMode();
  }
);


eraserButton.addEventListener(
  "click",
  ()=>{

    enableDrawMode();

    erasing = true;

    eraserButton.classList.add(
      "active"
    );

    penButton.classList.remove(
      "active"
    );
  }
);


/* =========================
   CLEAR
========================= */

clearButton.addEventListener(
  "click",
  ()=>{

    strokes = [];

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );
  }
);


/* =========================
   MESSAGE
========================= */

function showStrokeMessage(){

  strokeInfo.textContent =
    "Drawing disappears after 7 seconds";

  strokeInfo.classList.add(
    "show"
  );

  clearTimeout(infoTimeout);

  infoTimeout =
    setTimeout(()=>{
      strokeInfo.classList.remove(
        "show"
      );
    },1800);
}


/* =========================
   URL
========================= */

function normalizeURL(value){

  value =
    value.trim();

  if(!value){
    return null;
  }

  if(
    !/^https?:\/\//i.test(value)
  ){

    value =
      "https://" + value;
  }

  try{

    const url =
      new URL(value);

    if(
      url.protocol !== "http:" &&
      url.protocol !== "https:"
    ){
      return null;
    }

    return url.href;

  }catch{

    return null;
  }
}


function loadWebsite(){

  const url =
    normalizeURL(
      urlInput.value
    );

  if(!url){

    urlInput.focus();

    return;
  }

  blocked.style.display =
    "none";

  loaded = false;

  loading.style.display =
    "flex";

  clearTimeout(loadTimer);

  strokes = [];

  website.src =
    url;

  /*
    Some blocked iframe pages never provide
    a useful load event.
  */

  loadTimer =
    setTimeout(()=>{

      if(!loaded){

        loading.style.display =
          "none";

        blocked.style.display =
          "flex";
      }

    },8000);
}


goButton.addEventListener(
  "click",
  loadWebsite
);


urlInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      loadWebsite();
    }
  }
);


website.addEventListener(
  "load",
  ()=>{

    loaded = true;

    clearTimeout(loadTimer);

    loading.style.display =
      "none";
  }
);


tryAgain.addEventListener(
  "click",
  loadWebsite
);


/* =========================
   FULLSCREEN
========================= */

async function enterFullscreen(){

  document.body.classList.add(
    "fullscreen"
  );

  try{

    if(
      document.documentElement
        .requestFullscreen
    ){

      await document.documentElement
        .requestFullscreen();
    }

  }catch(error){

    /*
      CSS fullscreen still works if the
      browser doesn't permit native fullscreen.
    */
  }
}


async function leaveFullscreen(){

  document.body.classList.remove(
    "fullscreen"
  );

  try{

    if(document.fullscreenElement){

      await document.exitFullscreen();
    }

  }catch(error){}
}


fullscreenButton.addEventListener(
  "click",
  async()=>{

    if(
      document.body.classList.contains(
        "fullscreen"
      )
    ){

      await leaveFullscreen();

    }else{

      await enterFullscreen();
    }
  }
);


/* =========================
   START
========================= */

setTimeout(()=>{

  resizeCanvas();

  render();

},50);

</script>

</body>
</html>
